<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goal 07: 機構內互助資產建立 / Building Mutual Aid Capital</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <!-- D3.js for mind map visualization -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            overflow: hidden;
        }

        .mindmap-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .mindmap-svg-wrapper {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        svg {
            width: 100%;
            height: 100%;
        }

        .mindmap-node circle {
            cursor: pointer;
            stroke-width: 2px;
            transition: all 0.2s ease;
        }

        .mindmap-node text {
            font-size: 14px;
            font-weight: 500;
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
            user-select: none;
            fill: white;
        }

        .mindmap-node:hover circle {
            filter: brightness(1.1);
        }

        .mindmap-link {
            fill: none;
            stroke: #cbd5e1;
            stroke-width: 2px;
            stroke-linecap: round;
        }

        .mindmap-node-btn {
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .mindmap-node:hover .mindmap-node-btn {
            opacity: 1;
        }

        .mindmap-node-btn circle {
            fill: white;
            stroke: #4ade80;
            stroke-width: 1.5px;
        }

        .mindmap-node-btn text {
            fill: #4ade80;
            font-size: 16px;
            font-weight: bold;
            pointer-events: none;
        }

        .mindmap-node-btn:hover circle {
            fill: #f0fdf4;
        }

        .edit-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            min-width: 400px;
        }

        .edit-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        .edit-modal input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            margin-bottom: 12px;
            font-family: inherit;
        }

        .edit-modal input:focus {
            outline: none;
            border-color: #4ade80;
            box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.1);
        }

        .edit-modal-buttons {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .edit-modal button {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .edit-modal .btn-save {
            background: #4ade80;
            color: white;
        }

        .edit-modal .btn-save:hover {
            background: #22c55e;
        }

        .edit-modal .btn-cancel {
            background: #f1f5f9;
            color: #334155;
        }

        .edit-modal .btn-cancel:hover {
            background: #e2e8f0;
        }

        .edit-modal .btn-delete {
            background: #fca5a5;
            color: white;
            margin-right: auto;
        }

        .edit-modal .btn-delete:hover {
            background: #f87171;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-slate-50">
    <div class="flex h-screen flex-col overflow-hidden bg-white">
        <!-- Header -->
        <header class="flex-shrink-0 z-50 flex items-center justify-between border-b border-slate-200 bg-white px-6 py-4">
            <div class="flex items-center gap-3">
                <a href="../hub/code.html#forest" class="text-slate-600 hover:bg-slate-100 transition-colors p-2 rounded-lg">
                    <span class="material-symbols-outlined text-[20px]">arrow_back</span>
                </a>
                <div class="text-green-600 size-8 flex items-center justify-center bg-green-100 rounded-full p-1">
                    <span class="material-symbols-outlined text-2xl">spa</span>
                </div>
                <h1 class="text-slate-900 text-lg font-bold">生命種子計畫 / Seed of Life</h1>
            </div>
            <!-- 思考 Banner -->
            <div class="flex-1 max-w-2xl px-6 ml-6 mr-4">
                <div class="border border-red-500 rounded-md bg-white px-4 py-1.5 flex items-center gap-2">
                    <span class="text-slate-500 font-bold whitespace-nowrap text-[15px]">思考：</span>
                    <span id="thought-content" class="text-[15px] font-medium text-slate-800 flex-1 outline-none relative" contenteditable="true" spellcheck="false" data-default="她是否在「幫助別人」的過程中，感受到了自我價值？">她是否在「幫助別人」的過程中，感受到了自我價值？</span>
                    <span id="thought-save-status" class="text-[10px] text-green-500 font-bold opacity-0 transition-opacity ml-2">已儲存</span>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="zoom-in-btn" class="p-2 rounded-lg hover:bg-slate-100 transition-colors text-slate-600" title="放大">
                    <span class="material-symbols-outlined">zoom_in</span>
                </button>
                <button id="zoom-out-btn" class="p-2 rounded-lg hover:bg-slate-100 transition-colors text-slate-600" title="縮小">
                    <span class="material-symbols-outlined">zoom_out</span>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <div class="flex flex-1 overflow-hidden gap-4 p-4 bg-slate-50">
            <!-- Sidebar Info -->
            <div class="w-64 flex-shrink-0 bg-white rounded-lg shadow-sm p-6 overflow-y-auto border border-slate-200">
                <div class="mb-4">
                    <span class="inline-block bg-teal-100 text-teal-800 text-xs font-bold px-3 py-1 rounded-full mb-2">GOAL 07</span>
                    <h2 class="text-xl font-bold text-slate-900 mb-2">機構內互助資產建立</h2>
                    <p class="text-sm text-slate-600">Building Mutual Aid Capital</p>
                </div>
                <div class="border-t border-slate-200 pt-4">
                    <h3 class="font-bold text-sm text-slate-900 mb-3">操作指南 / Tips</h3>
                    <ul class="text-xs text-slate-600 space-y-2">
                        <li>✓ 懸停節點 → 點擊 <b>+</b> 新增</li>
                        <li>✓ 雙擊節點文字編輯</li>
                        <li>✓ 拖曳節點移動</li>
                        <li>✓ 滾輪縮放地圖</li>
                        <li>✓ 拖曳背景平移</li>
                    </ul>
                </div>
                <!-- Shared Resources List -->
                <div class="border-t border-slate-200 pt-4 mt-4">
                    <h3 class="font-bold text-sm text-slate-900 mb-3 flex items-center justify-between">
                        <span>共享資源 / Resources</span>
                        <span class="bg-slate-100 text-slate-500 text-[10px] px-2 py-0.5 rounded-full"
                            id="resCount">0</span>
                    </h3>
                    <div id="resourceList" class="space-y-3">
                        <!-- Resources will be injected here -->
                    </div>
                </div>

                <button id="clear-btn"
                    class="w-full mt-4 bg-red-500 text-white text-sm font-medium py-2 rounded-lg hover:bg-red-600 transition-colors">
                    重置心智圖
                </button>
            </div>

            <!-- Mind Map Canvas -->
            <div class="flex-1 bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden">
                <div class="mindmap-container">
                    <svg id="mindmap-svg"></svg>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal-overlay" class="edit-modal-overlay hidden"></div>
    <div id="edit-modal" class="edit-modal hidden">
        <h2 class="text-lg font-bold text-slate-900 mb-4">編輯節點</h2>
        <input type="text" id="edit-zh" placeholder="中文名稱 (Chinese)" />
        <input type="text" id="edit-en" placeholder="English Name" />
        <div class="edit-modal-buttons">
            <button id="edit-delete-btn" class="btn-delete">刪除</button>
            <button id="edit-cancel-btn" class="btn-cancel">取消</button>
            <button id="edit-save-btn" class="btn-save">保存</button>
        </div>
    </div>

    <script type="module">
        import { MindMap } from "../mindmap.js";
        import { initGoalResources } from "../load_resources.js";

        // ============================================
        // Initialize for Goal 01
        // ============================================

        document.addEventListener('DOMContentLoaded', function () {
            console.log('📄 DOMContentLoaded 事件觸發', {
                document: document.readyState,
                d3: typeof d3,
                svg: document.getElementById('mindmap-svg')
            });

            // Wait a moment for CSS to be applied
            setTimeout(() => {
                try {
                                        const defaultData = {
                        id: 'root',
                        zh: '互助資產',
                        en: 'Mutual Aid Capital',
                        children: [
                            {
                                id: 'b1',
                                zh: '利他行為',
                                en: 'Altruistic Behavior',
                                children: []
                            },
                            {
                                id: 'b2',
                                zh: '衝突管理',
                                en: 'Conflict Management',
                                children: []
                            },
                            {
                                id: 'b3',
                                zh: '社交位置',
                                en: 'Social Position',
                                children: []
                            },
                            {
                                id: 'b4',
                                zh: '被需要感',
                                en: 'Sense of Being Needed',
                                children: []
                            }
                        ]
                    };

                    const colorScheme = {
                        root: '#4ade80',      // 綠色
                        level1: '#60a5fa',    // 藍色
                        level2: '#fbbf24',    // 黃色
                        level3: '#f87171',    // 紅色
                        level4: '#a78bfa',    // 紫色
                    };

                    console.log('🚀 開始初始化心智圖...');
                    const mindMap = new MindMap('mindmap-svg', {
                        storageKey: 'goal-07-mindmap',
                        defaultData: defaultData,
                        colorScheme: colorScheme
                    });

                    console.log('✓ Goal 01 Mind Map initialized successfully');
                    window.mindMap = mindMap; // Expose for debugging
                } catch (error) {
                    console.error('❌ 初始化錯誤:', error);
                    console.error('堆棧:', error.stack);
                }
            }, 100);  // 100ms delay to ensure DOM is fully ready
        });
    </script>
    <script type="module">
        import { initGoalResources } from "../load_resources.js";
        initGoalResources('Goal 07');
    </script>
</body>

</html>
